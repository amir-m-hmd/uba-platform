global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    honor_timestamps: false
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    honor_timestamps: false
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node_exporter'
    honor_timestamps: false
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'clickhouse'
    honor_timestamps: false
    static_configs:
      - targets: ['clickhouse:9363']